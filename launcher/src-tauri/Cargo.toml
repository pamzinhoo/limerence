[package]
name = "limerence-launcher"
version = "0.1.0"
description = "Limerence Launcher"
edition = "2021"

[lib]
name = "limerence_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "process"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = "3"
open = "5"
thiserror = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "process", "test-util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
